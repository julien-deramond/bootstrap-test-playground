    <main class="d-flex min-vh-100 flex-column align-items-center justify-content-center p-7 md:p-11 bg-1">
      <div class="d-flex w-100 auth-max-sm flex-column gap-7">
        <a href="#" class="d-flex align-items-center gap-3 fw-medium fg-body text-decoration-none align-self-center">
          <span class="avatar avatar-xs theme-primary rounded-4"><svg class="bi" aria-hidden="true"><use href="#gallery-vertical-end"/></svg></span>
          Acme Inc.
        </a>
        <div class="card">
          <div class="card-body gap-7">
            <div class="d-flex flex-column gap-2 text-center">
              <h1 class="card-title fs-lg fw-semibold lh-1 mb-0">Welcome back</h1>
              <p class="fs-sm fg-2 mb-0">Login with your Apple or Google account</p>
            </div>
            <form class="d-flex flex-column gap-8">
              <div class="d-grid gap-4">
                <button type="button" class="btn-outline theme-secondary">
                  <svg class="bi" aria-hidden="true"><use href="#apple"/></svg>
                  Login with Apple
                </button>
                <button type="button" class="btn-outline theme-secondary">
                  <svg class="bi" aria-hidden="true"><use href="#google"/></svg>
                  Login with Google
                </button>
              </div>
              <div class="d-flex align-items-center gap-3 fs-sm fg-2">
                <hr class="flex-grow-1 m-0">
                <span>Or continue with</span>
                <hr class="flex-grow-1 m-0">
              </div>
              <div class="form-field">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" placeholder="m@example.com" required>
              </div>
              <div class="form-field">
                <div class="d-flex align-items-center">
                  <label for="password" class="form-label mb-0">Password</label>
                  <a href="#" class="ms-auto ps-3 fs-sm text-nowrap">Forgot your password?</a>
                </div>
                <input id="password" type="password" class="form-control" required>
              </div>
              <div class="d-grid gap-4">
                <button type="submit" class="btn-solid theme-primary">Login</button>
                <p class="form-text text-center mb-0">Don&apos;t have an account? <a href="#">Sign up</a></p>
              </div>
            </form>
          </div>
        </div>
        <p class="fs-sm fg-2 text-center text-balance px-7 mb-0">By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
      </div>
    </main>
