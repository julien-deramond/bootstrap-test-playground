<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-276: Theme inverse bg-muted is light in dark mode</title>
    <!--
      pg-276: Theme inverse bg-muted is light in dark mode
      Theme docs: fg-emphasis works best with muted, but inverse bg-muted is light in dark mode, so fg-emphasis on it is 2.14:1.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-276
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <p class="mb-0">Measured here: <code id="measured">…</code></p>

      <section>
        <div data-playground-repro>
          <div class="vstack gap-2">
            <div class="theme-inverse p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg-emphasis)">inverse: fg-emphasis on bg-muted</div>
            <div class="theme-inverse p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">inverse: fg on bg-muted</div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { assert } from './assert.js'

      const show = async () => {
        document.getElementById('measured').textContent = (await assert()).details
      }

      if (document.readyState === 'complete') {
        show()
      } else {
        window.addEventListener('load', show, { once: true })
      }
    </script>
  </body>
</html>
