    <!-- The reproduction's own CSS (tokens.css). -->
    <style>
      /*
       * Runtime customization with CSS custom properties, no Sass needed.
       * Empty by default, so the playground renders Bootstrap's defaults.
       *
       * This file goes through the same PostCSS step as main.scss, with the same
       * marker, so write tokens unprefixed like the Sass docs (`--border-radius`) or
       * prefixed like the compiled CSS (`--x-border-radius`). Both end up as `--x-*`.
       * See https://getbootstrap.com/docs/6.0/getting-started/css-variables/
       */
    </style>
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <code id="prefix-detected">…</code>
        <ol class="list-unstyled vstack gap-5" id="prefix-cases">
          <li data-prefix-case="range" data-expect="Range writes the fill ratio to {p}range-fill, which the track's gradient reads" data-issue="196">
            <div class="pg-marker"></div>
            <div class="form-range pg-narrow" id="case-range">
              <input type="range" class="form-range-input" min="0" max="100" value="30" aria-label="Range at 30%">
            </div>
          </li>

          <li data-prefix-case="carousel-interval" data-expect="Carousel autoplay writes its interval to {p}carousel-interval, which times the active indicator's fill" data-issue="196">
            <div class="pg-marker"></div>
            <div class="carousel slide pg-narrow" id="case-carousel-interval" data-bs-interval="1234">
              <div class="carousel-inner">
                <div class="carousel-item active"><div class="pg-slide"></div></div>
                <div class="carousel-item"><div class="pg-slide"></div></div>
              </div>
            </div>
          </li>

          <li data-prefix-case="carousel-loop" data-expect="With {p}carousel-items: 3, a carousel with ends: loop falls back to wrap, since seamless looping only supports one item at a time" data-issue="196">
            <div class="pg-marker"></div>
            <div class="carousel slide pg-narrow" id="case-carousel-loop" data-bs-ends="loop">
              <div class="carousel-inner">
                <div class="carousel-item active"><div class="pg-slide"></div></div>
                <div class="carousel-item"><div class="pg-slide"></div></div>
                <div class="carousel-item"><div class="pg-slide"></div></div>
                <div class="carousel-item"><div class="pg-slide"></div></div>
                <div class="carousel-item"><div class="pg-slide"></div></div>
              </div>
            </div>
          </li>

          <li data-prefix-case="nav-overflow" data-expect="Nav overflow with collapseBelow: '2xl' reads {p}breakpoint-2xl and moves every item into its menu, since the nav is narrower" data-issue="196">
            <div class="pg-marker"></div>
            <div class="nav-overflow pg-narrow" id="case-nav-overflow" data-bs-collapse-below="2xl">
              <ul class="nav nav-pills">
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="#case-nav-overflow">One</a></li>
                <li class="nav-item"><a class="nav-link" href="#case-nav-overflow">Two</a></li>
              </ul>
            </div>
          </li>
        </ol>
      </section>
    </main>

    <script type="module">
      // Each case gets its component from Bootstrap's JavaScript (options come
      // from data attributes), compares what it wrote or read with the custom
      // properties the compiled CSS uses, and writes data-result on its <li>.
      const html = document.documentElement
      const element = id => document.getElementById(`case-${id}`)
      const token = (node, name) => getComputedStyle(node).getPropertyValue(name).trim()

      // The prefix of the page's styles, from the `:root, :host` rule that
      // defines the breakpoints, which every build has, the grid entry point
      // included: `--bs-breakpoint-md` → `bs-`, `--breakpoint-md` → ''.
      const detectPrefix = () => {
        const walk = list => {
          for (const rule of list) {
            if (rule instanceof CSSStyleRule && rule.selectorText.split(',').some(selector => selector.trim() === ':root')) {
              const match = [...rule.style].map(property => property.match(/^--([a-z0-9-]*?)breakpoint-[a-z0-9]+$/)).find(Boolean)
              if (match) {
                return match[1]
              }
            } else if (rule.cssRules) {
              const found = walk(rule.cssRules)
              if (found !== undefined) {
                return found
              }
            }
          }
        }

        for (const sheet of document.styleSheets) {
          try {
            const found = walk(sheet.cssRules)
            if (found !== undefined) {
              return found
            }
          } catch {
            // Cross-origin stylesheets can't be read.
          }
        }
      }

      const run = ({ Carousel, NavOverflow, Range }) => {
        const prefix = detectPrefix()
        if (prefix === undefined) {
          throw new Error('No `:root` rule defines the breakpoints: are Bootstrap\'s styles loaded?')
        }

        const p = name => `--${prefix}${name}`
        document.getElementById('prefix-detected').textContent = prefix ? `--${prefix}*` : 'unprefixed custom properties'

        const CHECKS = {
          range: () => {
            Range.getOrCreateInstance(element('range'))
            return token(element('range'), p('range-fill')) === '0.3'
          },
          'carousel-interval': () => {
            const carousel = Carousel.getOrCreateInstance(element('carousel-interval'))
            carousel.cycle()
            carousel.pause()
            return token(element('carousel-interval'), p('carousel-interval')) === '1234ms'
          },
          'carousel-loop': () => {
            element('carousel-loop').style.setProperty(p('carousel-items'), '3')
            // `_canLoop()` decides between the seamless loop and the `wrap` jump.
            return Carousel.getOrCreateInstance(element('carousel-loop'))._canLoop() === false
          },
          'nav-overflow': () => {
            NavOverflow.getOrCreateInstance(element('nav-overflow'))
            const items = element('nav-overflow').querySelectorAll('.nav > .nav-item:not(:has(.nav-overflow-toggle))')
            return items.length === 2 && [...items].every(item => item.dataset.bsNavOverflow === 'true')
          }
        }

        for (const item of document.querySelectorAll('[data-prefix-case]')) {
          let pass = false
          try {
            pass = CHECKS[item.dataset.prefixCase]()
          } catch (error) {
            console.error(error)
          }

          item.dataset.result = pass ? 'pass' : 'fail'
          const issue = item.dataset.issue
          const marker = item.querySelector('.pg-marker')
          marker.className = 'pg-marker hstack gap-2 mb-2'
          marker.innerHTML = `<span class="badge ${pass ? 'theme-success' : 'theme-danger'}">${pass ? 'Pass' : 'Fail'}</span>
            <span>${item.dataset.expect.replaceAll('{p}', `--${prefix}`)}</span>
            ${issue ? `<a href="https://github.com/julien-deramond/bootstrap-test-playground/issues/${issue}">#${issue}</a>` : ''}`
        }

        html.dataset.prefixCases = 'done'
        // The visual suite waits for this to go before its screenshot. It's in
        // the markup: this script can run after `load`, too late to set it.
        delete html.dataset.playgroundBusy
      }

      // src/js/main.js exposes Bootstrap as `window.bootstrap` once its dynamic
      // import resolves, which may come after `load`. Timers rather than requestAnimationFrame, which stops in hidden
      // tabs.
      const start = () => {
        if (window.bootstrap && document.readyState === 'complete') {
          setTimeout(() => run(window.bootstrap), 50)
        } else {
          setTimeout(start, 50)
        }
      }

      start()
    </script>
  </body>
</html>
