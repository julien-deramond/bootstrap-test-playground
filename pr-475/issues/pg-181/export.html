<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-181: Issue reproduction</title>
    <!--
      pg-181: Issue reproduction
      The datepicker calendar sets color-scheme: light dark on itself, so it ignores a page made dark with color-scheme and stays white when the system is light.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-181
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body class="color-scheme-dark">
    <main class="container py-5">
      <section>
        <div class="row g-4">
          <div class="md:col-4" data-case="page">
            <div data-bs-toggle="datepicker" data-bs-inline="true"></div>
          </div>
          <div class="md:col-4" data-case="wrapper">
            <div style="color-scheme: dark" data-wrapper>
              <div data-bs-toggle="datepicker" data-bs-inline="true"></div>
            </div>
          </div>
          <div class="md:col-4" data-case="control">
            <div data-bs-theme="dark" data-wrapper>
              <div data-bs-toggle="datepicker" data-bs-inline="true"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      // Reproduction-specific JavaScript. Bootstrap is available as `window.bootstrap`.
    </script>
  </body>
</html>
