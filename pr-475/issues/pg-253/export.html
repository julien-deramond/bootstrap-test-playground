<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-253: Light mode links are under 4.5:1 on the body and gray backgrounds</title>
    <!--
      pg-253: Light mode links are under 4.5:1 on the body and gray backgrounds
      In light mode, - -link-color is - -primary-base, so links are 3.56:1 on the body background and lower on the gray ones, under the 4.5:1 text contrast.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-253
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <div data-playground-repro>
          <p class="p-3 mb-2">On <code>--bg-body</code>: <a href="#top">a link in text</a></p>
          <p class="p-3 mb-2 bg-1">On <code>--bg-1</code>: <a href="#top">a link in text</a></p>
          <p class="p-3 mb-0 bg-2">On <code>--bg-2</code>: <a href="#top">a link in text</a></p>
        </div>
      </section>
    </main>

    <script type="module">
      // Reproduction-specific JavaScript. Bootstrap is available as `window.bootstrap`.
    </script>
  </body>
</html>
