<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-372: The datepicker's selected day ignores .theme-*</title>
    <!--
      pg-372: The datepicker's selected day ignores .theme-*
      The datepicker colors its selected day and range edges from the primary pair, so wrapping it in a .theme-* class leaves the selection primary, where buttons and badges follow the theme.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-372
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <div data-playground-repro>
          <div class="d-flex flex-wrap gap-4 align-items-start">
            <div>
              <p class="fw-semibold">No theme</p>
              <div data-bs-toggle="datepicker" data-bs-inline="true" data-bs-selected-dates='["2026-10-13"]' data-test="plain"></div>
            </div>
            <div class="theme-success" data-test="themed">
              <p class="fw-semibold">Inside <code>.theme-success</code></p>
              <button type="button" class="btn-solid mb-3">Themed button</button>
              <div data-bs-toggle="datepicker" data-bs-inline="true" data-bs-selected-dates='["2026-10-13"]'></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      // Reproduction-specific JavaScript. Bootstrap is available as `window.bootstrap`.
    </script>
  </body>
</html>
