<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>#35941: Forced colors adaptations</title>
    <!--
      #35941: Forced colors adaptations
      Forced colors (Windows High Contrast): Bootstrap has no forced-colors rules, so components whose state is only a background color lose it.
      Upstream: https://github.com/twbs/bootstrap/issues/35941
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/35941
    -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data:; media-src 'self'; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <p class="mb-0">Forced colors here: <code id="measured">…</code></p>

      <section>
        <div data-playground-repro>
          <div class="vstack gap-4">
            <div class="hstack flex-wrap gap-2">
              <button type="button" class="btn-solid theme-primary">Solid button</button>
              <button type="button" class="btn-outline theme-primary">Outline button</button>
            </div>
            <div class="hstack flex-wrap gap-4">
              <div class="form-field">
                <input type="checkbox" id="forcedCheckOff" class="check">
                <label for="forcedCheckOff">Unchecked</label>
              </div>
              <div class="form-field">
                <input type="checkbox" id="forcedCheckOn" class="check" checked>
                <label for="forcedCheckOn">Checked</label>
              </div>
              <div class="form-field">
                <input type="radio" id="forcedRadioOn" name="forcedRadio" class="radio" checked>
                <label for="forcedRadioOn">Selected</label>
              </div>
              <div class="form-field">
                <input type="radio" id="forcedRadioOff" name="forcedRadio" class="radio">
                <label for="forcedRadioOff">Not selected</label>
              </div>
            </div>
            <div class="hstack flex-wrap gap-4">
              <div class="form-field">
                <div class="switch">
                  <input type="checkbox" id="forcedSwitchOff" role="switch" switch>
                </div>
                <label for="forcedSwitchOff">Off</label>
              </div>
              <div class="form-field">
                <div class="switch">
                  <input type="checkbox" id="forcedSwitchOn" role="switch" switch checked>
                </div>
                <label for="forcedSwitchOn">On</label>
              </div>
            </div>
            <ul class="nav nav-pills">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Active</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
            </ul>
            <div class="progress" role="progressbar" aria-label="Forced colors progress" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar" style="width: 60%"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      const forced = window.matchMedia('(forced-colors: active)')
      const show = () => {
        document.getElementById('measured').textContent = forced.matches ? 'active' : 'off, turn them on (step 1)'
      }
      forced.addEventListener('change', show)
      show()
    </script>
  </body>
</html>
