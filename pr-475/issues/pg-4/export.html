<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-4: Checkbox ignores --check-border-radius</title>
    <!--
      pg-4: Checkbox ignores - -check-border-radius
      Checkbox: the - -check-border-radius token is ignored, the border radius is hard-coded to 33%.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-4
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <!-- The reproduction's own CSS (tokens.css). -->
    <style>
      /*
       * The override under test: a component token, in Bootstrap's `custom` layer,
       * which comes after `components`. Square checkboxes are expected.
       */
      @layer custom {
        .check {
          --bs-check-border-radius: 0;
        }
      }
    </style>
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <p class="mb-0">Measured here: <code id="measured">…</code></p>

      <section>
        <div data-playground-repro>
          <input type="checkbox" id="check" class="check" aria-label="Example checkbox" checked />
        </div>
      </section>
    </main>

    <script type="module">
      const show = () => {
        const style = getComputedStyle(document.querySelector('.check'))
        document.getElementById('measured').textContent =
          `--bs-check-border-radius: ${style.getPropertyValue('--bs-check-border-radius').trim()}, border-radius: ${style.borderRadius}`
      }

      if (document.readyState === 'complete') {
        show()
      } else {
        window.addEventListener('load', show, { once: true })
      }
    </script>
  </body>
</html>
