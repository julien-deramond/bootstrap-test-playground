<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-138: Issue reproduction</title>
    <!--
      pg-138: Issue reproduction
      In RTL, the floated label of a floating label field sits 27px to 31px from the inline start instead of lining up with the input text, because it scales from the left corner.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-138
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <div data-playground-repro>
          <div class="vstack gap-4">
            <div dir="ltr" data-direction="ltr" class="vstack gap-3">
              <div class="form-floating">
                <label for="floating-ltr-email">Email address (LTR)</label>
                <input type="email" class="form-control" id="floating-ltr-email" placeholder="name@example.com" value="name@example.com">
              </div>
              <div class="form-floating">
                <label for="floating-ltr-comments">Comments (LTR)</label>
                <textarea class="form-control" id="floating-ltr-comments" placeholder="Leave a comment here">Some text</textarea>
              </div>
            </div>
            <div dir="rtl" data-direction="rtl" class="vstack gap-3">
              <div class="form-floating">
                <label for="floating-rtl-email">Email address (RTL)</label>
                <input type="email" class="form-control" id="floating-rtl-email" placeholder="name@example.com" value="name@example.com">
              </div>
              <div class="form-floating">
                <label for="floating-rtl-comments">Comments (RTL)</label>
                <textarea class="form-control" id="floating-rtl-comments" placeholder="Leave a comment here">Some text</textarea>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      // Reproduction-specific JavaScript. Bootstrap is available as `window.bootstrap`.
    </script>
  </body>
</html>
