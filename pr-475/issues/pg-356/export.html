<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-356: Issue reproduction</title>
    <!--
      pg-356: Issue reproduction
      Tab on the last control of a popup datepicker's calendar leaves the document, because the popup is the last child of the body: the popup stays open and the next Tab starts again from the top.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-356
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <div class="vstack gap-4 w-16">
          <div class="vstack gap-2">
            <label class="form-label" for="empty">Departure (no selected date)</label>
            <input type="text" class="form-control" id="empty" data-bs-toggle="datepicker" autocomplete="off" placeholder="Choose date…">
            <button type="button" class="btn-solid theme-primary" id="after-empty">Next stop</button>
          </div>
          <div class="vstack gap-2">
            <label class="form-label" for="selected">Return (a day gets selected before Tab)</label>
            <input type="text" class="form-control" id="selected" data-bs-toggle="datepicker" autocomplete="off" placeholder="Choose date…">
            <button type="button" class="btn-solid theme-primary" id="after-selected">Next stop</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      // Reproduction-specific JavaScript. Bootstrap is available as `window.bootstrap`.
    </script>
  </body>
</html>
