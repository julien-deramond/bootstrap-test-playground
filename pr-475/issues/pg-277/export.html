<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-277: Theme fg unreadable on bg-muted</title>
    <!--
      pg-277: Theme fg unreadable on bg-muted
      Theme docs: fg should be accessible on bg-muted, but it is under 4.5:1 for six of eight theme colors in light mode (down to 2.60:1).
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-277
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <p class="mb-0">Measured here: <code id="measured">…</code></p>

      <section>
        <div data-playground-repro>
          <div class="vstack gap-2">
            <div class="theme-primary p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">primary: fg on bg-muted</div>
            <div class="theme-accent p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">accent: fg on bg-muted</div>
            <div class="theme-success p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">success: fg on bg-muted</div>
            <div class="theme-danger p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">danger: fg on bg-muted</div>
            <div class="theme-warning p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">warning: fg on bg-muted</div>
            <div class="theme-info p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">info: fg on bg-muted</div>
            <div class="theme-secondary p-2 rounded" style="background: var(--bs-theme-bg-muted); color: var(--bs-theme-fg)">secondary: fg on bg-muted</div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { assert } from './assert.js'

      const show = async () => {
        document.getElementById('measured').textContent = (await assert()).details
      }

      if (document.readyState === 'complete') {
        show()
      } else {
        window.addEventListener('load', show, { once: true })
      }
    </script>
  </body>
</html>
