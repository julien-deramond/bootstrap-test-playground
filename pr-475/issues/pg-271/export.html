<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-271: The close button's focus ring is clipped by the icon's mask</title>
    <!--
      pg-271: The close button's focus ring is clipped by the icon's mask
      The close button draws its icon with mask-image on the button itself, and a mask clips everything the element paints, so the focus ring it declares on :focus-visible never shows: only the icon's opacity changes.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-271
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <div data-playground-repro>
          <div class="d-flex flex-wrap gap-5 align-items-center p-4">
            <button type="button" class="btn-solid theme-primary" data-ring="button">Regular button</button>
            <button type="button" class="btn-close" aria-label="Close" data-ring="btn-close"></button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
