<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-133: Range fill and value bubble in RTL</title>
    <!--
      pg-133: Range fill and value bubble in RTL
      Range: in RTL the track fill is painted from the left and the value bubble is placed with left, so the fill ends away from the thumb and the bubble floats off it.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-133
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <p class="mb-0">Measured here: <code id="measured">…</code></p>

      <section>
        <div data-playground-repro>
          <div dir="rtl" class="px-4 pt-5 pb-3">
            <div class="form-range" data-bs-bubble>
              <input type="range" class="form-range-input" min="0" max="100" value="20" aria-label="Brightness, right to left">
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { assert } from './assert.js'

      const show = async () => {
        document.getElementById('measured').textContent = (await assert()).details
      }

      if (document.readyState === 'complete') {
        show()
      } else {
        window.addEventListener('load', show, { once: true })
      }
    </script>
  </body>
</html>
