<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-274: Carousel indicators have no focus ring of their own</title>
    <!--
      pg-274: Carousel indicators have no focus ring of their own
      Carousel indicators set no :focus-visible style, so a focused indicator shows only the browser's default outline instead of Bootstrap's focus ring, like the prev/next controls.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-274
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <div data-playground-repro>
          <div class="carousel" id="carousel-indicators-focus">
            <div class="d-flex gap-3 align-items-center">
              <button type="button" class="btn-icon btn-sm" data-bs-target="#carousel-indicators-focus" data-bs-slide="prev">
                <span class="carousel-icon-prev" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
              </button>
              <div class="carousel-indicators">
                <button type="button" data-bs-target="#carousel-indicators-focus" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carousel-indicators-focus" data-bs-slide-to="1" aria-label="Slide 2"></button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
