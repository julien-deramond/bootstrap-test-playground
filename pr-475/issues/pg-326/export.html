<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-326: Issue reproduction</title>
    <!--
      pg-326: Issue reproduction
      In RTL, the chip input's arrow keys don't flip: the arrows still follow the LTR order, so each one points away from the chip that gets focus.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-326
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <section>
        <div data-playground-repro>
          <div class="chip-input" data-bs-chips>
            <label class="chip-input-label" for="skillsInput">Skills:</label>
            <span class="chip">
              JavaScript
            </span>
            <span class="chip">
              TypeScript
            </span>
            <input type="text" class="form-ghost" id="skillsInput" placeholder="Add more…" />
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      // Reproduction-specific JavaScript. Bootstrap is available as `window.bootstrap`.
    </script>
  </body>
</html>
