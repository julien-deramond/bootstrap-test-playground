<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pg-261: Combobox selection never announced</title>
    <!--
      pg-261: Combobox selection never announced
      Combobox: items get aria-selected without role=option, so the selection is never announced.
      Bootstrap: main at 2f63a73 (https://github.com/twbs/bootstrap/commit/2f63a737635d9c8daea42bb5509f4fe81c0e6789)
      Styles: Bootstrap's dist/ build from jsDelivr. JavaScript: dist/js/bootstrap.bundle.min.js from jsDelivr.
      Exported from https://github.com/julien-deramond/bootstrap-test-playground/tree/main/issues/pg-261
    -->
    <!-- Bootstrap's default build, from the same commit. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/css/bootstrap.min.css">
    <script type="module">
      // Bootstrap's JavaScript, every component and its dependencies in one module.
      import * as bootstrap from 'https://cdn.jsdelivr.net/gh/twbs/bootstrap@2f63a737635d9c8daea42bb5509f4fe81c0e6789/dist/js/bootstrap.bundle.min.js'
      window.bootstrap = bootstrap
    </script>
  </head>
  <body>
    <main class="container py-5">
      <p class="mb-0">Measured here: <code id="measured">…</code></p>

      <section>
        <div data-playground-repro>
          <div class="form-field">
            <label for="exampleCombobox" class="form-label">Combobox</label>
            <button class="form-control combobox-toggle" type="button"
                data-bs-toggle="combobox"
                data-bs-name="country"
                data-bs-placeholder="Pick a country…">
              <span class="combobox-value">Pick a country…</span>
              <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z" fill="currentcolor"/></svg>
            </button>
            <div class="menu">
              <button class="menu-item" type="button" data-bs-value="us">United States</button>
              <button class="menu-item selected" type="button" data-bs-value="uk" aria-selected="true">United Kingdom</button>
              <button class="menu-item" type="button" data-bs-value="ca">Canada</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      // The combobox renders the selection once Bootstrap is on `window.bootstrap`.
      const ready = () => new Promise(resolve => {
        const check = () => (window.bootstrap && document.readyState === 'complete' ? resolve() : setTimeout(check, 50))
        check()
      })
      await ready()

      const items = [...document.querySelector('[data-playground-repro]').querySelectorAll('.menu-item[data-bs-value]')]
      const roles = [...new Set(items.map(item => item.getAttribute('role') || 'none'))].join(', ')
      document.getElementById('measured').textContent =
        `${items.filter(item => item.hasAttribute('aria-selected')).length} of ${items.length} items have aria-selected; item roles: ${roles}`
    </script>
  </body>
</html>
