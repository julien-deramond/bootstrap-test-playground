<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compare</title>
    <link rel="icon" href="/bootstrap-test-playground/pr-475/favicon.svg" type="image/svg+xml">
    <style>body{flex-direction:column;height:100vh;margin:0;display:flex}.compare-panes{background:var(--bs-border-color);isolation:isolate;flex:1;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:1px;min-height:0;display:grid}.compare-panes[data-count="3"]{grid-template-columns:1fr 1fr 1fr}.compare-pane{background:var(--bs-bg-body);flex-direction:column;min-height:0;display:flex}.compare-pane iframe{border:0;flex:1;inline-size:100%}.compare-side{border-block-end:1px solid var(--bs-border-color);flex-wrap:wrap;align-items:center;gap:.5rem;padding:.5rem;display:flex}.compare-side select,.compare-bar select{inline-size:auto}.compare-bar{--bs-link-color:var(--bs-primary-fg)}.compare-bar .form-range{inline-size:8rem}.compare-value{font-variant-numeric:tabular-nums;min-inline-size:3ch}.compare-panes.compare-stacked{grid-template:"a b""stack stack"minmax(0,1fr)/1fr 1fr;gap:0}.compare-stacked>.compare-pane{display:contents}.compare-stacked .compare-side{background:var(--bs-bg-body)}.compare-stacked>[data-pane="0"] .compare-side{border-inline-end:1px solid var(--bs-border-color);grid-area:a}.compare-stacked>[data-pane="1"] .compare-side{grid-area:b}.compare-stacked iframe{grid-area:stack;block-size:100%}[data-mode=overlay]>[data-pane="1"] iframe{opacity:var(--compare-opacity)}[data-mode=slider]>[data-pane="1"] iframe{clip-path:inset(0 0 0 var(--compare-split))}[data-mode=slider]:dir(rtl)>[data-pane="1"] iframe{clip-path:inset(0 var(--compare-split) 0 0)}[data-mode=difference]>[data-pane="1"] iframe{pointer-events:none;mix-blend-mode:difference}.compare-handle{display:none}[data-mode=slider]>.compare-handle{z-index:1;cursor:ew-resize;touch-action:none;inline-size:1.5rem;grid-area:stack;justify-self:start;margin-inline-start:-.75rem;display:block;position:relative;inset-inline-start:var(--compare-split)}.compare-handle:before{content:"";background:var(--bs-primary-base);inline-size:2px;position:absolute;inset-block:0;inset-inline-start:calc(50% - 1px)}.compare-handle:after{content:"";background:var(--bs-bg-body);border:2px solid var(--bs-primary-base);border-radius:50%;block-size:1.5rem;inline-size:1.5rem;position:absolute;inset-block-start:calc(50% - .75rem);inset-inline-start:0}.compare-dragging iframe{pointer-events:none}.compare-panes>.compare-pane[hidden]{display:none}@media (width<768px){.compare-panes,.compare-panes[data-count="3"]{grid-template-columns:1fr}.compare-panes.compare-stacked{grid-template:"a""b""stack"minmax(0,1fr)/1fr}.compare-stacked>[data-pane="0"] .compare-side{border-inline-end:0}}</style>
    <script type="module" crossorigin src="/bootstrap-test-playground/pr-475/assets/compare-bbmRmEmZ.js"></script>
    <link rel="modulepreload" crossorigin href="/bootstrap-test-playground/pr-475/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="/bootstrap-test-playground/pr-475/assets/_virtual_playground-pages-vKXQSeZa.js">
    <link rel="stylesheet" crossorigin href="/bootstrap-test-playground/pr-475/assets/index-CnXlIq3Y.css">
  </head>
  <body>
    <header class="compare-bar d-flex flex-wrap gap-3 align-items-center p-2 border-bottom">
      <a href="/bootstrap-test-playground/pr-475/" class="fw-bold">Playground</a>
      <label class="d-flex gap-2 align-items-center">Page <select class="form-control form-control-sm" id="compare-page"></select></label>
      <span class="d-flex flex-wrap gap-2 align-items-center" role="group" aria-label="Presets">
        Presets
        <button type="button" class="btn-outline theme-secondary btn-sm" data-preset="theme">Light / Dark</button>
        <button type="button" class="btn-outline theme-secondary btn-sm" data-preset="dir">LTR / RTL</button>
        <button type="button" class="btn-outline theme-secondary btn-sm" data-preset="config">Working / Default</button>
        <button type="button" class="btn-outline theme-secondary btn-sm" data-preset="dist">Source / Dist</button>
        <button type="button" class="btn-outline theme-secondary btn-sm" data-preset="commits" hidden>Commit A / B</button>
        <button type="button" class="btn-outline theme-secondary btn-sm" data-preset="grid">Light / Dark × Working / Default</button>
      </span>
      <button type="button" class="btn-outline theme-secondary btn-sm" id="compare-add">Add pane</button>
      <label class="d-flex gap-2 align-items-center">View
        <select class="form-control form-control-sm" id="compare-mode">
          <option value="side">Side by side</option>
          <option value="overlay">Overlay</option>
          <option value="slider">Slider</option>
          <option value="difference">Difference</option>
        </select>
      </label>
      <span id="compare-opacity-field" hidden>
        <label class="d-flex gap-2 align-items-center">Opacity
          <span class="form-range"><input type="range" class="form-range-input" id="compare-opacity" min="0" max="100" step="1"></span>
          <span class="compare-value" aria-hidden="true"></span>
        </label>
      </span>
      <span id="compare-split-field" hidden>
        <label class="d-flex gap-2 align-items-center">Split
          <span class="form-range"><input type="range" class="form-range-input" id="compare-split" min="0" max="100" step="1"></span>
          <span class="compare-value" aria-hidden="true"></span>
        </label>
      </span>
      <label class="d-flex gap-2 align-items-center"><input type="checkbox" class="check" id="compare-sync" checked> Sync scroll</label>
      <a id="compare-open" href="#" class="ms-auto">Open page</a>
    </header>
    <main class="compare-panes" id="compare-panes">
      <div class="compare-handle" id="compare-handle" aria-hidden="true"></div>
    </main>
  </body>
</html>
