name: Engines

# The console crawl and the visual suite in Firefox and WebKit, every night and
# on demand. Pull requests run them in Chromium only (console.yml, visual.yml),
# and the smoke tests in all three engines (smoke.yml). An engine-only failure
# is usually a browser difference Bootstrap doesn't handle: track it upstream,
# and list it in tests/console/known-issues.js with `engines`, or refresh the
# engine's baselines once it's tracked: `update-baselines` on a pull request
# that changes the page, or `update-all-baselines` on any pull request.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps firefox webkit
        timeout-minutes: 10

      - run: npx playwright test --project console-firefox --project console-webkit

      - run: npx playwright test --project visual-firefox --project visual-webkit
        if: ${{ !cancelled() }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: engines-report
          path: tests/report/
          retention-days: 14
