name: Console crawl

# Opens every page and fails on uncaught exceptions, console errors and
# warnings, and failed requests. Known upstream bugs are allowlisted in
# tests/console/known-issues.js.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:console
