name: Configs

# Compiles the working copy, every config in configs/ and every reproduction in
# issues/, and fails on a Sass or PostCSS error. Warnings, such as Sass
# deprecations, show up as annotations on the run and the pull request. Then
# checks that the default config still compiles like Bootstrap's own build,
# audits the tokens of every config for new undefined or unused ones,
# compiles Bootstrap under combinations of its $enable-* options, audits the
# default CSS for new physical left/right declarations, audits its motion
# against prefers-reduced-motion and the two motion options, audits its
# cascade layers, and compiles every partial alone after root (Option B). Also validates the HTML of every page, and checks that the
# configs table in configs/README.md matches the configs' READMEs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check-configs

      - run: npm run check-dist

      - run: npm run audit-tokens
        if: ${{ !cancelled() }}

      - run: npm run compile-matrix
        if: ${{ !cancelled() }}

      - run: npm run audit-rtl
        if: ${{ !cancelled() }}

      - run: npm run audit-motion
        if: ${{ !cancelled() }}

      - run: npm run audit-layers
        if: ${{ !cancelled() }}

      - run: npm run audit-partials
        if: ${{ !cancelled() }}

      - run: npm run lint:html
        if: ${{ !cancelled() }}

      - run: npm run configs-table -- --check
        if: ${{ !cancelled() }}

      # The normalized CSS and the full diffs, when the dist check fails.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: dist-drift
          path: reports/dist/
          retention-days: 14
