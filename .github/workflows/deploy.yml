name: Deploy to GitHub Pages

# Builds main and publishes it at the root of the gh-pages branch, which
# GitHub Pages serves at https://julien-deramond.github.io/bootstrap-test-playground/
# (Settings → Pages: Deploy from a branch, gh-pages, / (root)). The pull
# requests' previews sit next to it in pr-<n>/ (preview.yml), and a deploy
# of main keeps them. See "Deployment" in docs/pages.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The site is served from /<repo>/, so every URL needs that prefix.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          retention-days: 1

  # Pushes the build, and nothing else: no npm here, the job that can write.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      - uses: ./.github/actions/publish-pages
        with:
          path: ${{ runner.temp }}/site
          target: .
          message: Deploy ${{ github.sha }}
