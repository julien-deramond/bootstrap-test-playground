name: Smoke tests

# Opens, drives and closes every Bootstrap JavaScript component on its kitchen
# sink page, with the working copy and every config, and fails on a missing
# event or a stuck state. Known upstream bugs are listed in
# tests/smoke/known-issues.js.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:smoke
