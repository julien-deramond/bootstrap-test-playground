name: Smoke tests

# Opens, drives and closes every Bootstrap JavaScript component on its kitchen
# sink page, with the working copy and every config, in Chromium, Firefox and
# WebKit, and fails on a missing event or a stuck state. Known upstream bugs
# are listed in tests/smoke/known-issues.js.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:smoke:engines

      # One project per engine in the report, so an engine-only failure stands out.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: smoke-report
          path: tests/report/
          retention-days: 14
