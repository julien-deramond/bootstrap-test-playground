name: Visual tests

# Compares every page with the Linux baselines in tests/visual/screenshots/linux/,
# in Chromium; engines.yml compares Firefox and WebKit every night. To create or
# refresh them after an intended change, add the `update-baselines` label to the
# pull request: the `update` job records them, commits them to the pull
# request's branch and removes the label, and the checks run again on that
# commit. While the label is on, `compare` fails without comparing, so the pull
# request can't look ready before the baselines are on its branch.
#
# The `update` job only records what the pull request needs:
# - Chromium: every page, compared like `compare` does.
# - Firefox and WebKit, much slower: only the pages the pull request changes
#   (`npm run test-scope`), or every page after a shared change, like
#   Bootstrap, the working copy in src/styles/, src/js/, the build, Playwright
#   or the visual specs. The `update-all-baselines` label asks for every page.
# A baseline is only written when it's missing or fails the comparison
# (`--update-snapshots=changed`): one that still passes stays as it is, even
# if a new screenshot of it differs by a few bytes. The baselines no test
# compares with any more, like a removed page's, are deleted
# (`npm run prune-baselines`).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # The `update` job's fallback when no workflow starts on its commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled') || contains(fromJSON('["update-baselines", "update-all-baselines"]'), github.event.label.name) }}
    # Pinned, so the fonts that baselines are recorded with don't change under them.
    runs-on: ubuntu-24.04
    concurrency:
      group: visual-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The labels as they are now, not in the event: `gh pr create --label`
      # adds them just after `opened`.
      - id: labels
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx -e update-baselines -e update-all-baselines; then
            message="An \`update-baselines\` label is on: the \`update\` job is recording new baselines. Wait for it, and don't merge before then. It pushes them to this branch, removes the label and runs this comparison again on its commit."
            echo "::error title=Baselines are being recorded::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:visual

      # Expected, actual and diff for each failure: download it and open
      # index.html, or run `npx playwright show-report <folder>`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.labels.outcome != 'failure' }}
        with:
          name: visual-report
          path: tests/report/
          retention-days: 14

  update:
    # Only for branches of this repository: a fork's branch can't be pushed to.
    if: ${{ github.event.action == 'labeled' && contains(fromJSON('["update-baselines", "update-all-baselines"]'), github.event.label.name) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      BRANCH: ${{ github.head_ref }}
      GH_TOKEN: ${{ github.token }}
      LABEL: ${{ github.event.label.name }}
      PR: ${{ github.event.pull_request.number }}
      # Every baseline the runs compare with, for `npm run prune-baselines`.
      VISUAL_BASELINES_USED: reports/baselines-used.txt
    steps:
      # The whole history, without the files' contents, so `npm run
      # test-scope` finds where the branch started from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox webkit

      # Chromium, every page.
      - run: npm run test:visual -- --update-snapshots=changed

      # Sets VISUAL_SCOPE, which limits the pages of the next step.
      - run: |
          if [ "$LABEL" = update-all-baselines ]; then
            echo 'VISUAL_SCOPE={"full":true,"reason":"the update-all-baselines label"}' >> "$GITHUB_ENV"
          else
            npm run test-scope -- "origin/$GITHUB_BASE_REF"
          fi

      # Their baselines are in their own folders, which the nightly engines.yml
      # compares against.
      - run: npx playwright test --project visual-firefox --project visual-webkit --update-snapshots=changed --pass-with-no-tests

      - run: npm run prune-baselines

      # Commits only to the open pull request's branch, and only while it still
      # points to the commit the baselines were recorded from: a plain push
      # would recreate a branch deleted by the merge. The commit goes through
      # the GraphQL API (scripts/commit-via-api.mjs) instead of `git push`, so
      # GitHub signs it and it shows as Verified. When nothing changed, an
      # empty commit gives `compare` a commit of its own, since its run on the
      # current one failed on the label.
      - id: push
        run: |
          recorded_from=$(git rev-parse HEAD)
          git add tests/visual/screenshots/linux
          if git diff --cached --quiet; then
            changed=false
            message="test: the Linux visual baselines are up to date"
          else
            changed=true
            message="test: update the Linux visual baselines"
          fi

          fail() {
            echo "::error title=Baselines not pushed::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "**Visual baselines not pushed.** $1 ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))"
            exit 1
          }
          # Nothing is lost when the baselines didn't change.
          check_state() {
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            if [ "$state" != OPEN ] && [ "$changed" = false ]; then
              echo "#$PR is ${state,,} and its baselines were up to date: nothing to push."
              exit 0
            fi
            case $state in
              MERGED) fail "#$PR was merged before its new baselines were pushed, so \`main\` is missing them and its visual tests fail. This run's *visual-baselines* artifact holds them: copy it over \`tests/visual/screenshots/linux/\` in a new pull request." ;;
              CLOSED) fail "#$PR was closed before its new baselines were pushed. To record them, reopen it and add the \`$LABEL\` label again." ;;
            esac
          }

          check_state
          status=0
          sha=$(node scripts/commit-via-api.mjs "$BRANCH" "$recorded_from" "$message") || status=$?
          if [ "$status" -ne 0 ]; then
            check_state
            if [ "$status" -eq 2 ]; then
              fail "\`$BRANCH\` moved while the baselines were being recorded. Add the \`$LABEL\` label again to record them from its new commit."
            fi
            fail "GitHub refused the commit with the new baselines. This run's *visual-baselines* artifact holds them."
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && steps.push.outcome == 'failure' }}
        with:
          name: visual-baselines
          path: tests/visual/screenshots/linux/
          retention-days: 14

      - if: ${{ always() }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"

      # A push made with GITHUB_TOKEN starts the pull request's workflows, but
      # GitHub holds them for approval (action required): github-actions[bot]
      # is a first-time contributor here. Approving them runs `compare` and the
      # other checks on the new commit, where the pull request shows them. If
      # none show up, `compare` still runs, but only in the Actions tab.
      - if: ${{ steps.push.outputs.pushed == 'true' }}
        run: |
          approved=""
          for _ in $(seq 1 12); do
            sleep 5
            new=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=action_required" --jq '.workflow_runs[].id' | grep -vxF -e "${approved:-none}" || true)
            for id in $new; do
              if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null; then
                message="The workflows on the new commit are waiting for approval, and CI couldn't approve them. Approve them on the pull request to run \`compare\` there."
                echo "::error title=Checks not started::$message"
                gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "**Visual baselines pushed.** $message"
                exit 1
              fi
              approved="${approved:+$approved$'\n'}$id"
            done
            # Stop once the runs that were held are all approved.
            if [ -n "$approved" ] && [ -z "$new" ]; then break; fi
          done
          if [ -n "$approved" ]; then
            echo "Approved the runs held on ${SHA:0:7}: $(echo "$approved" | paste -sd ' ' -)"
          elif [ -z "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request" --jq '.workflow_runs[].id')" ]; then
            echo "::warning title=Comparison in the Actions tab::No workflow started on ${SHA:0:7}, so \`compare\` runs from a dispatch, which the pull request doesn't show."
            gh workflow run visual.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          fi
        env:
          SHA: ${{ steps.push.outputs.sha }}
