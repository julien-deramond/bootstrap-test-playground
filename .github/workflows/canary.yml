name: Canary

# Every night: moves Bootstrap to the latest v6-dev commit, resyncs the kitchen
# sink from that commit's docs, runs every check (npm run canary-report) and
# opens or updates one pull request with the report. Does nothing when v6-dev
# hasn't moved. Never merges.
#
# Opening the pull request needs either a CANARY_TOKEN repository secret (a
# fine-grained token limited to this repository, with contents, pull requests
# and issues read/write: issues covers the labels and comments), or "Allow
# GitHub Actions to create and approve pull requests" in the repository's
# Actions settings. With GITHUB_TOKEN, the pull request doesn't start the
# other workflows: the report is the only check run.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run the checks even if v6-dev hasn't moved (no pull request without changes)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

env:
  BRANCH: canary/bootstrap
  GH_TOKEN: ${{ secrets.CANARY_TOKEN || github.token }}

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CANARY_TOKEN || github.token }}

      - name: Check whether v6-dev moved
        id: check
        run: |
          from=$(node -p "require('./package-lock.json').packages['node_modules/bootstrap'].resolved.split('#')[1]")
          head=$(git ls-remote https://github.com/twbs/bootstrap.git refs/heads/v6-dev | cut -f1)
          echo "from=$from" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced run."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          elif [ "$from" = "$head" ]; then
            echo "v6-dev is still at ${from:0:7}: nothing to do."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&state=open" --jq '.[].title' | grep -q "${head:0:7}"; then
            echo "The canary pull request is already at ${head:0:7}: nothing to do."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.check.outputs.moved == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Update Bootstrap
        id: update
        if: steps.check.outputs.moved == 'true'
        run: |
          # npm 11 writes the lockfile like the maintainers' npm does (with its
          # `libc` fields). Node 22's npm 10 would strip them, a diff on every run.
          npm install -g npm@11
          npm ci
          # Like `npm run update-bootstrap`: package.json keeps `#v6-dev`, the lockfile pins the commit.
          npm install bootstrap@github:twbs/bootstrap#v6-dev
          to=$(node -p "require('./package-lock.json').packages['node_modules/bootstrap'].resolved.split('#')[1]")
          echo "to=$to" >> "$GITHUB_OUTPUT"

      # The npm package doesn't ship the docs: fetch exactly that commit.
      - name: Resync the kitchen sink
        if: steps.check.outputs.moved == 'true'
        run: |
          git init -q ../bootstrap-docs
          git -C ../bootstrap-docs fetch -q --depth 1 https://github.com/twbs/bootstrap.git "${{ steps.update.outputs.to }}"
          git -C ../bootstrap-docs checkout -q FETCH_HEAD
          npm run sync-kitchen-sink -- ../bootstrap-docs

      - name: Run the checks
        if: steps.check.outputs.moved == 'true'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run canary-report -- --from "${{ steps.check.outputs.from }}" --to "${{ steps.update.outputs.to }}"

      # The report, and Playwright's report of the last suite run: the visual
      # diffs.
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.moved == 'true' && !cancelled()
        with:
          name: canary-report
          path: |
            reports/
            tests/report/
          retention-days: 14

      - name: Open or update the pull request
        if: steps.check.outputs.moved == 'true'
        run: |
          to="${{ steps.update.outputs.to }}"
          title="chore(deps): update bootstrap to v6-dev@${to:0:7}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # A forced run on an unchanged v6-dev has nothing to propose. Compare
          # the Bootstrap commit, not the lockfile: other entries can change
          # format with the npm version.
          if [ "$to" = "${{ steps.check.outputs.from }}" ] && [ -z "$(git status --porcelain -- kitchen-sink)" ]; then
            echo "Nothing changed: no pull request. The report is in the run's artifact."
            exit 0
          fi

          bot="41898282+github-actions[bot]@users.noreply.github.com"
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&state=open" --jq '.[0].number // empty')

          # Someone took the pull request over: don't force-push over their commits.
          if [ -n "$number" ] && git fetch -q origin "$BRANCH" && git log --format=%ae "origin/main..origin/$BRANCH" | grep -Fxqv "$bot"; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" --silent \
              -f body="v6-dev moved to \`${to:0:7}\`, but this branch has commits of its own, so the canary left it alone. The new report is in the [run's *canary-report* artifact]($run_url). Merge or close this pull request to let the canary take over again."
            echo "The canary branch has commits of its own: left it alone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "$bot"
          git switch -C "$BRANCH"
          git add package.json package-lock.json kitchen-sink
          git commit -q -m "$title" -m "Opened by the nightly canary: $run_url"
          git push -q --force origin "$BRANCH"

          {
            cat reports/canary/report.md
            echo
            echo "---"
            echo "Opened by the nightly canary ([run]($run_url), [\`canary.yml\`](.github/workflows/canary.yml)). The run's *canary-report* artifact has the full report and the visual diffs. Never merged automatically."
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" --silent
          else
            number=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title="$title" -f head="$BRANCH" -f base=main -F body=@"$RUNNER_TEMP/body.md" --jq .number)
          fi

          # A failing check shows in the pull request list.
          gh label create canary --color C5DEF5 --description "Opened by the nightly canary" --force
          gh label create checks-failing --color D93F0B --description "A check fails on this pull request" --force
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" -f "labels[]=canary" --silent
          if [ "$(node -p "require('./reports/canary/summary.json').failed.length")" -gt 0 ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" -f "labels[]=checks-failing" --silent
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$number/labels/checks-failing" --silent || true
          fi
          echo "Pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number"
